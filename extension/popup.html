<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Prime Sync</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="top">
      <img class="logo" src="icons/icon48.png" alt="" width="28" height="28" />
      <div class="brand">
        <h1>Prime Sync</h1>
        <span id="version" class="version"></span>
      </div>
      <div class="lang" role="group" data-i18n-title="language">
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="pt">PT</button>
      </div>
      <span id="status" class="status"><i></i><b>—</b></span>
    </header>

    <section class="card">
      <label class="label" for="room" data-i18n="roomCode"></label>
      <div class="row">
        <input id="room" class="code" type="text" maxlength="12" autocomplete="off" spellcheck="false" placeholder="XXXXXX" />
        <button id="generate" class="icon-btn" type="button" data-i18n-title="newCode">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.9-3.9M4 4v4h4M4 13a8 8 0 0 0 14.9 3.9M20 20v-4h-4" /></svg>
        </button>
        <button id="copy" class="icon-btn" type="button" data-i18n-title="copyCode">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2" /><path d="M5 15V6a2 2 0 0 1 2-2h9" /></svg>
        </button>
      </div>
      <p class="hint" data-i18n-html="sameCode"></p>
      <p id="publicWarn" class="warn-line" data-i18n="publicWarn" hidden></p>

      <label class="label" for="name" data-i18n="chatName"></label>
      <input id="name" type="text" maxlength="24" autocomplete="off" data-i18n-placeholder="namePlaceholder" />
    </section>

    <details id="server" class="card server">
      <summary>
        <span class="label" data-i18n="mqttServer"></span>
        <span id="broker" class="broker"></span>
        <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6" /></svg>
      </summary>
      <div class="server-body">
        <label class="label" for="brokerUrl" data-i18n="address"></label>
        <input id="brokerUrl" type="url" autocomplete="off" spellcheck="false" placeholder="wss://your-broker.example.com:8084/mqtt" />
        <div class="row two">
          <div>
            <label class="label" for="username" data-i18n="username"></label>
            <input id="username" type="text" autocomplete="off" spellcheck="false" data-i18n-placeholder="optional" />
          </div>
          <div>
            <label class="label" for="password" data-i18n="password"></label>
            <input id="password" type="password" autocomplete="off" data-i18n-placeholder="optional" />
          </div>
        </div>
        <p id="serverHint" class="hint"></p>
        <div id="suggest" class="suggest">
          <p data-i18n-html="suggestIntro"></p>
          <p class="risk" data-i18n="suggestRisk"></p>
          <button id="usePublic" class="btn ghost small" type="button" data-i18n="usePublic"></button>
        </div>
      </div>
    </details>

    <section class="card toggles">
      <label class="toggle">
        <span data-i18n="syncEnabled"></span>
        <input id="enabled" type="checkbox" />
        <i aria-hidden="true"></i>
      </label>
      <label class="toggle">
        <span data-i18n="showPanel"></span>
        <input id="showOverlay" type="checkbox" />
        <i aria-hidden="true"></i>
      </label>
    </section>

    <a id="open-prime" class="card link-row" href="https://www.primevideo.com" target="_blank" rel="noreferrer">
      <svg class="lead" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3" /><path d="m10 9.5 4.5 2.5-4.5 2.5z" /></svg>
      <span data-i18n="openPrime"></span>
      <svg class="trail" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4" /></svg>
    </a>

    <footer class="actions">
      <button id="leave" class="btn ghost danger" type="button" data-i18n="leaveRoom"></button>
      <button id="ok" class="btn primary" type="button" data-i18n-title="okTitle">OK</button>
    </footer>

    <script src="i18n.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
